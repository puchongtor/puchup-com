    <path id="circlePath" d="M 60,200 A 140,140 0 1 1 340,200" fill="none"/>
    <path id="circlePathBottom" d="M 60,200 A 140,140 0 1 0 340,200" fill="none"/>
  </defs>

  <circle cx="200" cy="200" r="185" fill="#FFFFFF" stroke="#F5EEDC" stroke-width="3"/>
