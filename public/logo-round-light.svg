<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="'IBM Plex Sans Thai','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="rocketGrad" x1="20" y1="220" x2="200" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.45" stop-color="#F0553C"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0D182C" flood-opacity="0.15"/>
