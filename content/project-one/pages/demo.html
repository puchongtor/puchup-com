          <a href="${item.file}" data-name="${item.name.toLowerCase()} ${item.kind.toLowerCase()}" class="biz-card bg-white border border-[var(--line)] rounded-2xl overflow-hidden shadow-sm group block">
            <div>
              <div class="aspect-[4/3] bg-[var(--bg-alt)] relative overflow-hidden">
                <img src="${item.img}" alt="${item.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-[var(--ink)]/60 via-transparent to-transparent opacity-70"></div>
                <span class="absolute bottom-3 left-3 text-[10px] font-mono bg-white/95 text-[var(--ink)] font-bold px-2.5 py-1 rounded-md backdrop-blur-sm shadow-sm">
                  ${item.file}
                </span>
              </div>
              <div class="p-5">
                <span class="text-[10px] font-mono tracking-wider text-[var(--purple)] uppercase font-bold block mb-1">${item.kind}</span>
                <h4 class="font-display font-semibold text-lg text-[var(--ink)] mb-3 leading-snug group-hover:text-[var(--purple)] transition-colors">${item.name}</h4>
                <div class="bg-[var(--bg-alt)] p-3 rounded-xl border border-[var(--line)] text-[11px] text-[var(--ink-soft)] leading-relaxed">
                  <strong class="text-[var(--ink)] block mb-0.5 font-mono text-[10px] uppercase text-[var(--orange)]">Architecture Stack</strong>
                  ${item.focus}
                </div>
              </div>
            </div>
            <div class="p-5 pt-0">
              <span class="block text-center text-xs font-mono font-bold tracking-wider uppercase bg-[var(--ink)] text-white py-3 rounded-full group-hover:bg-[var(--purple)] transition-all duration-200 shadow-sm">
                เปิดชม Live Demo →
              </span>
            </div>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.04 });
  
  document.querySelectorAll('.cat-group').forEach(el => observer.observe(el));
}

buildShowroomHTML();

/* ============ SEARCH & FILTER LOGIC ============ */
const bizSearch = document.getElementById('bizSearch');
const typeFilters = document.getElementById('typeFilters');
let currentActiveType = 'all';

function executeFilteringPipeline() {
  const query = bizSearch.value.trim().toLowerCase();
  let globalMatchCounter = 0;

  document.querySelectorAll('.cat-group').forEach(group => {
    const isCategoryMatch = currentActiveType === 'all' || group.dataset.type === currentActiveType;
    let explicitCardsVisible = 0;

    group.querySelectorAll('.biz-card').forEach(card => {
      const isSearchMatch = !query || card.dataset.name.includes(query);
      
      if (isSearchMatch) {
        card.style.display = 'flex';
        explicitCardsVisible++;
      } else {
        card.style.display = 'none';
      }
    });

    if (isCategoryMatch && explicitCardsVisible > 0) {
      group.style.display = '';
      globalMatchCounter += explicitCardsVisible;
    } else {
      group.style.display = 'none';
    }
  });

  document.getElementById('noResults').classList.toggle('hidden', globalMatchCounter > 0);
}

bizSearch.addEventListener('input', executeFilteringPipeline);

typeFilters.querySelectorAll('button').forEach(button => {
  button.addEventListener('click', () => {
    typeFilters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    currentActiveType = button.dataset.type;
    executeFilteringPipeline();
  });
});
</script>
</body>
