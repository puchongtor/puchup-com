    <path d="M104 156 C 90 166 82 180 79 196 C 96 190 105 178 111 164 Z" fill="#F0553C"/>
  </g>

  <!-- wordmark -->
  <text x="260" y="150" font-size="110" font-weight="700" fill="#172033">Puch<tspan fill="url(#rocketGrad)">Up</tspan></text>

  <!-- tagline -->
  <text x="264" y="188" font-size="24" letter-spacing="2" fill="#596273">LEVEL UP YOUR BUSINESS &amp; LIFE.</text>
